<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f5c4b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><title>Yakeen NEET 2027 Discipline Planner</title>
<style>

:root[data-theme=dark]{--bg:#0c1714;--fg:#e7efec;--mu:#8fa59d;--cd:#13231f;--ac:#f0b429;--ao:#1b1300;--gd:#f0b429;--bd:#24382f;--P:#7aa2ff;--C:#ffb454;--B:#5fd68a;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 92px}
h1,.big,.qt{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif}
h1{font-size:28px;line-height:1.15;margin:4px 0}h2{font-size:15px;margin:0 0 8px}p{margin:6px 0}.mu{color:var(--mu);font-size:13px}
.big{font-size:64px;line-height:1;font-weight:700;letter-spacing:-1px}.big small{font-size:22px;font-weight:400;color:var(--mu);letter-spacing:0}
.qt{border-left:4px solid var(--gd);padding:6px 0 6px 14px;margin:14px 0;font-size:19px;font-style:italic;line-height:1.35}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.sc{border-left:4px solid var(--c)}.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0}.bar b{display:block;height:100%}
.strip{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin:10px 0}.strip button{aspect-ratio:1;border:0;border-radius:4px;background:var(--bd);color:var(--fg);font-size:9px;padding:0}
.strip .cur{outline:2px solid var(--gd)}.g4{background:var(--B)!important;color:#fff!important}.g3{background:#7aa62b!important;color:#fff!important}.g2{background:var(--C)!important;color:#000!important}.g1{background:var(--bad)!important;color:#fff!important}
.tk{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}.tk input{width:20px;height:20px;accent-color:var(--ac)}
.ch{position:relative}.ch input{position:absolute;opacity:0}.ch span{display:inline-block;padding:5px 9px;border:1px solid var(--bd);border-radius:99px;font-size:12px;margin:2px 3px 2px 0}
.ch input:checked+span{background:var(--ac);color:var(--ao);border-color:var(--ac)}.ch input:focus-visible+span{outline:2px solid var(--gd)}
.cr{padding:9px 0;border-bottom:1px solid var(--bd)}.cn{font-weight:600}.cn i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.cn small{color:var(--mu);margin-left:8px;font-weight:400;font-size:12px}
.kc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:4px 0}.kc input[type=number]{width:56px;padding:4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 1px;font:600 12px system-ui}nav .on{color:var(--ac);box-shadow:inset 0 2px var(--ac)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.btn{border:1px solid var(--bd);background:var(--cd);color:var(--fg);border-radius:9px;padding:8px 12px;font:600 14px system-ui}
.pri{background:var(--ac);color:var(--ao);border-color:var(--ac)}input[type=number],input[type=date],select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:15px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dg{overflow-x:auto}.dg table{border-collapse:collapse;width:100%;font-size:12px}.dg td,.dg th{padding:4px 3px;text-align:center;border-bottom:1px solid var(--bd)}.dg th{font-weight:600;color:var(--mu)}
.w{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border:0;border-bottom:1px solid var(--bd);font-size:13px;width:100%;background:none;color:var(--fg);text-align:left}
.pill{border-radius:6px;padding:1px 8px;font-weight:700}details{margin:8px 0}summary{font-weight:700;cursor:pointer}li{margin:3px 0}.sel{display:flex;gap:8px;align-items:center;margin:6px 0}.sel b{width:78px}.sel select{flex:1}
</style></head><body><main id="v"></main><nav id="nav"></nav>
<script>
const S0=new Date(2026,8,28),DAY=864e5,$=s=>document.querySelector(s);
let st;try{st=JSON.parse(localStorage.getItem('np2'))}catch(e){}
if(!st){try{st=JSON.parse(localStorage.getItem('np1'))}catch(e){}if(st)st.d={}}
st=st||{};['c','d','k','h','s'].forEach(k=>st[k]=st[k]||{});st.t=st.t||[];st.hp=st.hp||[2.5,2,2.5];st.y=st.y||{P:6,C:9,B:20};
const save=()=>{try{localStorage.setItem('np2',JSON.stringify(st))}catch(e){}};
const dt=n=>new Date(S0.getTime()+(n-1)*DAY),fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayOf=s=>Math.round((new Date(s+'T00:00:00')-S0)/DAY)+1,weekOf=n=>Math.ceil(n/7);
const N=Math.max(1,Math.min(210,dayOf(iso(new Date())))),CW=weekOf(N);
const pop=x=>x.toString(2).replace(/0/g,'').length,gc=id=>st.c[id]||0,done=id=>(gc(id)&7)==7;
const L={P:"Units & Measurements|Motion in a Straight Line|Motion in a Plane|Laws of Motion|Work Energy Power|Rotational Motion|Gravitation|Mechanical Properties of Solids|Mechanical Properties of Fluids|Thermal Properties|Thermodynamics|Kinetic Theory|Oscillations|Waves|Electrostatics|Current Electricity|Moving Charges & Magnetism|Magnetism & Matter|EMI|Alternating Current|EM Waves|Ray Optics|Wave Optics|Dual Nature|Atoms|Nuclei|Semiconductors",
C:"Mole Concept|Atomic Structure|Chemical Thermodynamics|Chemical Equilibrium|Ionic Equilibrium|Redox Reactions|Solutions|Electrochemistry|Chemical Kinetics|Periodicity|Chemical Bonding|s & p Block|d & f Block|Coordination Compounds|GOC|Hydrocarbons|Haloalkanes & Haloarenes|Alcohols Phenols Ethers|Aldehydes & Ketones|Carboxylic Acids & Amines|Biomolecules & Polymers",
B:"The Living World|Biological Classification|Plant Kingdom|Animal Kingdom|Morphology of Flowering Plants|Anatomy of Flowering Plants|Structural Organisation in Animals|Cell: The Unit of Life|Biomolecules|Cell Cycle & Cell Division|Photosynthesis|Respiration in Plants|Plant Growth & Development|Breathing & Exchange of Gases|Body Fluids & Circulation|Excretory Products|Locomotion & Movement|Neural Control|Chemical Coordination|Digestion & Absorption|Sexual Reproduction in Plants|Human Reproduction|Reproductive Health|Inheritance & Variation|Molecular Basis of Inheritance|Evolution|Human Health & Disease|Microbes in Human Welfare|Biotechnology|Organisms & Populations|Ecosystem & Biodiversity"};
const NM={P:'Physics',C:'Chemistry',B:'Biology'},ch=[];for(const k in L)L[k].split('|').forEach((n,i)=>ch.push({id:k+i,k,n}));
const BLW={1:{P:['P5'],C:['C0','C1'],B:['B13','B14']},2:{C:['C2','C3'],B:['B15','B19']},3:{C:['C4','C5'],B:['B16','B17']},4:{C:['C6'],B:['B18','B7']},5:{C:['C7'],B:['B9']},6:{C:['C8'],B:['B5']}};
let W=[];
function build(){ch.forEach(x=>{x.yw=0;x.bw=0;x.rw=0});
 for(const w in BLW)for(const k in BLW[w])BLW[w][k].forEach(id=>ch.find(x=>x.id===id).bw=+w);
 ['P','C','B'].forEach(k=>{const r=ch.filter(x=>x.k===k&&+x.id.slice(1)>=st.y[k]&&!x.bw);r.forEach((x,j)=>x.yw=Math.floor(j*20/r.length)+1)});
 const cnt={P:27,C:21,B:31};ch.forEach(x=>x.key=(+x.id.slice(1)+1)/cnt[x.k]);const so=[...ch].sort((a,b)=>a.key-b.key);so.forEach((x,i)=>x.rw=21+Math.floor(i*6/so.length));
 W=[];for(let w=1;w<=30;w++)W.push({w,ids:ch.filter(x=>(w<=20?x.bw===w||x.yw===w:x.rw===w)).map(x=>x.id),ph:w<=6?'Phase 1: Backlog Blitz':w<=20?'Phase 2: Stay in Sync with Yakeen':w<=26?'Phase 3: Revision and AITS':'Phase 4: Final Sprint',pt:w<=6?1:w<=20?1+(w%2===0?1:0):w<=26?2:w<=28?3:2,tg:Math.min(650,Math.round((340+w*11.5)/10)*10)})}
build();
const Q=["Motivation gets you started. Discipline gets you the seat.","Your rank is written in the hours nobody sees.","Backlog is not a verdict. It is a to-do list.","You do not need a perfect day. You need a completed day.","Show up tired. Show up bored. Just show up.","Every question you solve is a mark you no longer have to hope for.","The drop year is not a delay. It is a second chance with better information.","Stop counting the days. Make the days count.","Be so consistent that exam day feels like just another test day.","Study when you feel like it, and especially when you don't.","Today's discomfort is tomorrow's white coat.","Errors are free tuition. Write every one down.","A tick mark today is a rank tomorrow.","Phone down. Book open. Future loading.","Champions are boring: sleep, revise, repeat.","650 is not luck. It is 210 ordinary days done right.","Small daily wins beat rare heroic efforts.","The syllabus is finite. Your discipline decides how fast it ends.","Don't wait for the mood. Build the routine.","Your only competition is yesterday's you at 9 pm."];
const DR=["Same wake-up time every day, no exceptions.","Phone on silent and out of reach in every study block.","Physics, Chemistry and Biology every single day.","Finish the day's Yakeen lectures and DPPs before you sleep.","Every wrong question goes into the Error notebook.","Sunday: test in the morning, analysis in the evening.","Seven hours of sleep. A tired brain forgets.","Never miss twice. If you skip a day, the next one is non-negotiable."];
const TK=[];['P','C','B'].forEach(k=>['Yakeen class + notes','DPP + PYQs','Backlog / revision'].forEach(t=>TK.push([k,NM[k]+': '+t])));TK.push(['*','Error notebook'],['*','NCERT, formulas, diagrams (20 min)']);
const gr=p=>p>=85?'A+':p>=70?'A':p>=55?'B':p>=40?'C':'D',gcl=p=>p>=85?'g4':p>=70?'g3':p>=55?'g2':'g1';
function ws(w){const o=W[w-1],ids=o.ids,late=w>20,cp=ids.length?ids.reduce((a,id)=>a+(late?(gc(id)>>3&1):pop(gc(id)&7)/3),0)/ids.length:null;let dd=0;for(let i=1;i<=7;i++)if(pop(st.d[(w-1)*7+i]||0)>=8)dd++;
 const ts=st.t.filter(t=>weekOf(dayOf(t.d))===w),tp=Math.min(1,ts.length/o.pt),dp=dd/7,p=Math.round((cp===null?.6*dp+.4*tp:.5*cp+.3*dp+.2*tp)*100);
 return{cp,dd,ts,pt:o.pt,p,g:gr(p),av:ts.length?Math.round(ts.reduce((a,t)=>a+t.p+t.c+t.b,0)/ts.length):null}}
const bar=(p,c)=>`<div class=bar><b style="width:${p}%;background:var(${c||'--ac'})"></b></div>`;
const ST=[['Lecture',1],['NCERT/Notes',2],['PYQ 40+',4],['Revise',8]];
const chip=id=>ST.map(([l,b])=>`<label class=ch><input type=checkbox data-c="${id}:${b}" ${gc(id)&b?'checked':''}><span>${l}</span></label>`).join('');
const kc=id=>{const k=st.k[id]||[0,0,0,0],i=(j,p)=>`<input type=number min=0 data-k="${id}:${j}" value="${k[j]||''}" placeholder="${p}">`;return`<div class=kc>Lectures ${i(0,0)}/${i(1,'total')} DPPs ${i(2,0)}/${i(3,'total')}</div>`};
const lab=x=>x.bw?'Backlog W'+x.bw:x.yw?'Yakeen W'+x.yw:'Covered';
const cr=x=>`<div class=cr><div class=cn><i style="background:var(--${x.k})"></i>${x.n}<small>${lab(x)}, revise W${x.rw}</small></div>${kc(x.id)}${chip(x.id)}</div>`;
const tick=(n,i)=>`<label class=tk><input type=checkbox data-d="${n}:${i}" ${(st.d[n]||0)>>i&1?'checked':''}><span>${TK[i][1]}</span></label>`;
function streak(){let n=N,c=0;if(pop(st.d[n]||0)<8)n--;while(n>=1&&pop(st.d[n]||0)>=8){c++;n--}return c}
const hsum=n=>(st.h[n]||[0,0,0]).reduce((x,y)=>x+y,0);
const mis=(w,k)=>{const nm=a=>a.map(x=>x.n).join(', ');
 if(w>20){const r=ch.filter(x=>x.k===k&&x.rw===w);return['Yakeen revision classes and AITS review','Revise: '+(r.length?nm(r.slice(0,5))+(r.length>5?` +${r.length-5} more`:''):'weak chapters from your Error notebook')]}
 const y=ch.filter(x=>x.k===k&&x.yw===w),b=ch.filter(x=>x.k===k&&x.bw===w);
 return[y.length?nm(y):'Continue the current Yakeen chapter and finish its DPPs',b.length?'Backlog: '+nm(b):w<=6?'Backlog: clear skipped DPPs and PYQ sheets':`Revise Week ${Math.max(1,w-1)} and Week ${Math.max(1,w-4)} chapters (spaced repetition)`]};
const missionCards=w=>['P','C','B'].map(k=>{const[a,b]=mis(w,k);return`<div class="card sc" style="--c:var(--${k})"><h2 style="color:var(--${k})">${NM[k]}</h2><p><b>Yakeen:</b> ${a}</p><p><b>${w>20?'Revision':'Backlog'}:</b> ${b.replace(/^(Backlog|Revise): /,'')}</p></div>`}).join('');
const hrs=()=>{const a=st.h[N]||[0,0,0];return`<div class=card><h2>Study hours today</h2>${['P','C','B'].map((k,i)=>`<div class=row style="margin:6px 0"><b style="color:var(--${k});width:78px">${NM[k]}</b><span class=mu>done</span><input type=number step=.5 min=0 data-h="${i}" value="${a[i]||''}" placeholder=0 style="width:70px"><span class=mu>plan</span><input type=number step=.5 min=0 data-hp="${i}" value="${st.hp[i]}" style="width:70px"></div>${bar(Math.min(100,Math.round((a[i]||0)/(st.hp[i]||1)*100)),'--'+k)}`).join('')}<p class=mu>Total ${hsum(N)}h of ${st.hp.reduce((x,y)=>x+y,0)}h</p></div>`};
const inp='padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)';
const sched=()=>{const s=st.s[N]||[];return`<div class=card><h2>Today's schedule</h2>${s.map((x,i)=>`<label class=tk><input type=checkbox data-s="${i}" ${x.d?'checked':''}><span><b>${x.t}</b> ${x.x}</span></label>`).join('')||'<p class=mu>Add time slots, for example 6:00 Physics class.</p>'}<div class=row style="margin-top:8px"><input type=time id=stt style="width:110px;${inp}"><input id=stx placeholder="What to do" style="flex:1;min-width:0;${inp}"><button class="btn pri" data-a="slot:0">Add</button></div>${s.length?'<p><button class=btn data-a="slotclear:0">Clear schedule</button></p>':''}</div>`};
const strip=()=>`<div class=strip>${W.map(o=>{const s=ws(o.w),past=o.w<=CW;return`<button data-a="goto:${o.w}" class="${past?gcl(s.p):''} ${o.w===CW?'cur':''}" title="Week ${o.w}">${o.w}</button>`}).join('')}</div>`;
const sync=()=>`<div class=card><h2>Yakeen sync</h2><p class=mu>Pick the chapter your Yakeen class is teaching right now. The plan re-paces the remaining chapters so they finish by 15 Feb 2027, when Yakeen's live syllabus ends.</p>${['P','C','B'].map(k=>`<label class=sel><b style="color:var(--${k})">${NM[k]}</b><select data-y="${k}">${ch.filter(x=>x.k===k).map(x=>`<option value="${x.id.slice(1)}" ${st.y[k]==x.id.slice(1)?'selected':''}>${x.n}</option>`).join('')}</select></label>`).join('')}</div>`;
let tab='t',vw=CW,cf='all';
const V={
t(){const o=W[CW-1],s=ws(CW),late=ch.filter(x=>(x.bw||x.yw)&&(x.bw||x.yw)<CW&&(x.bw||x.yw)<=20&&!done(x.id)),dn=ch.filter(x=>done(x.id)).length,tm=st.d[N]||0,yl=141-N;
 const grp=k=>`<div class="card sc" style="--c:var(--${k})"><h2 style="color:var(--${k})">${NM[k]}</h2>${[0,1,2].map(j=>tick(N,['P','C','B'].indexOf(k)*3+j)).join('')}</div>`;
 return`<div class=big>Day ${N}<small> / 210</small></div><p class=mu>${fmt(dt(N))}, Week ${CW} of 30, ${o.ph}. ${yl>=0?`${yl+1} days of live Yakeen classes left (till 15 Feb 2027).`:'Yakeen syllabus is done. Revision and tests now.'}</p>${strip()}
<div class=qt>“${Q[(N-1)%Q.length]}”</div>${st.ys?'':`<div class=card><h2>First, sync with Yakeen</h2><p>Tell the planner which chapter each Yakeen class is on today, so the pace matches your batch.</p><button class="btn pri" data-a="tab:ch">Set Yakeen position</button></div>`}
<h2>Today's mission, all three subjects</h2>${missionCards(CW)}<div class=card><h2>Daily checklist</h2><p class=mu>Tick 8 of 11 to count the day. Streak: ${streak()} days.</p></div>${['P','C','B'].map(grp).join('')}<div class=card><h2>Discipline</h2>${[9,10].map(i=>tick(N,i)).join('')}</div>${hrs()}${sched()}
<div class=card><h2>Progress: ${dn} of ${ch.length} chapters complete</h2>${['P','C','B'].map(k=>{const a=ch.filter(x=>x.k===k),p=Math.round(a.reduce((t,x)=>t+pop(gc(x.id))/4,0)/a.length*100);return`<p class=mu>${NM[k]} ${p}%</p>${bar(p,'--'+k)}`}).join('')}</div>
<div class=card><h2>Still pending from earlier weeks</h2>${late.length?late.slice(0,10).map(x=>`<p><b style="color:var(--${x.k})">${x.n}</b> <span class=mu>${lab(x)}, ${3-pop(gc(x.id)&7)} steps left</span></p>`).join('')+(late.length>10?`<p class=mu>${late.length-10} more in the Tracker tab.</p>`:''):'<p>Nothing pending. Keep this streak alive.</p>'}</div>
<div class=card><h2>Discipline code</h2><ol>${DR.map(r=>`<li>${r}</li>`).join('')}</ol></div>`},
wk(){const o=W[vw-1],s=ws(vw),a=(vw-1)*7+1;
 return`<div class=row><button class=btn data-a="wk:-1">Prev</button><h2 style="margin:0">Week ${vw} of 30</h2><button class=btn data-a="wk:1">Next</button></div><p class=mu>${fmt(dt(a))} to ${fmt(dt(a+6))}, ${o.ph}</p>
<div class=card><h2>Targets</h2><p>Score target ${o.tg}+ in tests. Tests this week: ${o.pt}${vw<=20?' (Sunday weekly test'+(o.pt>1?' plus one AITS or RBT':'')+')':' (AITS and sectional tests)'}. Every day: Physics, Chemistry and Biology.</p></div>${missionCards(vw)}
${o.ids.length?`<div class=card><h2>${vw>20?'Chapters to revise':'Chapters this week'}</h2>${o.ids.map(id=>cr(ch.find(x=>x.id===id))).join('')}</div>`:''}
<div class=card><h2>Daily grid</h2><div class=dg><table><tr><th></th>${TK.map((t,i)=>`<th style="color:var(--${t[0]==='*'?'mu':t[0]})">${t[0]==='*'?(i===9?'Err':'Ref'):t[0]+(i%3+1)}</th>`).join('')}</tr>${[0,1,2,3,4,5,6].map(i=>{const n=a+i;return`<tr><td>${fmt(dt(n))}${n===N?' *':''}</td>${TK.map((t,j)=>`<td><input type=checkbox data-d="${n}:${j}" ${(st.d[n]||0)>>j&1?'checked':''}></td>`).join('')}</tr>`}).join('')}</table></div><p class=mu>1 Yakeen class, 2 DPP and PYQs, 3 Backlog or revision. Err is the Error notebook, Ref is NCERT and formulas.</p></div>
<div class=card><h2>Week report card: <span class="pill ${gcl(s.p)}">${s.g}</span> ${s.p}%</h2><p class=mu>Chapters ${s.cp===null?'none scheduled':Math.round(s.cp*100)+'%'}, days done ${s.dd}/7, tests ${s.ts.length}/${s.pt}${s.av!==null?', test average '+s.av+'/720 (target '+o.tg+')':''}</p></div>`},
ch(){const S=i=>ch.reduce((a,x)=>a+((st.k[x.id]||[])[i]||0),0),pp=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0,ld=S(0),lt=S(1),dd=S(2),dl=S(3),pl=W.filter(o=>o.w<=CW).reduce((a,o)=>a+o.pt,0),wh=[1,2,3,4,5,6,7].reduce((a,i)=>a+hsum((CW-1)*7+i),0),hp=st.hp.reduce((x,y)=>x+y,0)*7,hv=[6,5,4,3,2,1,0].map(d=>N-d<1?0:hsum(N-d)),mx=Math.max(10,...hv);
 return`<h1>Tracker</h1>${sync()}<div class=card><h2>Overall progress</h2><p class=mu>Lectures ${ld} of ${lt||'?'}</p>${bar(pp(ld,lt))}<p class=mu>DPPs ${dd} of ${dl||'?'}</p>${bar(pp(dd,dl),'--C')}<p class=mu>Tests ${st.t.length} of ${pl} planned so far</p>${bar(pp(st.t.length,pl),'--B')}<p class=mu>Study hours this week ${wh} of ${hp}</p>${bar(pp(wh,hp),'--P')}</div>
<div class=card><h2>Study hours, last 7 days</h2><svg viewBox="0 0 320 110" width="100%">${hv.map((v,i)=>`<rect x=${10+i*44} y=${90-v/mx*80} width=34 height=${v/mx*80} rx=4 fill="var(--ac)"/><text x=${27+i*44} y=105 font-size=10 text-anchor=middle fill="var(--mu)">${v||''}</text>`).join('')}</svg></div>
<p class=mu>For each chapter, enter your batch's total lectures and DPPs once, then raise the done count as you go.</p><div class=row>${[['all','All'],['P','Physics'],['C','Chem'],['B','Bio']].map(([k,l])=>`<button class="btn ${cf===k?'pri':''}" data-a="f:${k}">${l}</button>`).join('')}</div><div class=card>${ch.filter(x=>cf==='all'||x.k===cf).map(cr).join('')}</div>`},
ts(){const T=st.t,pts=T.map(t=>t.p+t.c+t.b),X=i=>20+(pts.length>1?i*280/(pts.length-1):140),Y=v=>110-Math.max(0,v)/720*100;
 return`<h1>Tests</h1><div class=card><h2>Log a test</h2><div class=g><select id=tt><option>Weekly</option><option>AITS</option><option>RBT</option><option>Subject</option></select><input type=date id=td value="${iso(new Date())}"><span></span><input type=number id=tp placeholder="Phy /180"><input type=number id=tc placeholder="Chem /180"><input type=number id=tb placeholder="Bio /360"></div><p><button class="btn pri" data-a="add:0">Save test</button></p><p id=terr style="color:var(--bad)"></p></div>
${pts.length?`<div class=card><h2>Score trend (target 650)</h2><svg viewBox="0 0 320 120" width="100%"><line x1=10 x2=310 y1=${Y(650)} y2=${Y(650)} stroke="var(--B)" stroke-dasharray="4"/><polyline fill=none stroke="var(--ac)" stroke-width=2.5 points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${pts.map((v,i)=>`<circle cx=${X(i)} cy=${Y(v)} r=3.5 fill="var(--ac)"/>`).join('')}</svg></div>`:'<p class=mu>No tests yet. Log your first one after Sunday.</p>'}
<div class=card>${T.map((t,i)=>`<div class=row style="padding:6px 0;border-bottom:1px solid var(--bd)"><div><b>${t.p+t.c+t.b}/720</b> <span class=mu>${t.ty}, ${fmt(new Date(t.d+'T00:00:00'))}<br>Physics ${t.p}, Chemistry ${t.c}, Biology ${t.b}</span></div><button class=btn data-a="del:${i}">Delete</button></div>`).reverse().join('')||'<p class=mu>Empty</p>'}</div>`},
rp(){const a=W.filter(o=>o.w<=CW).map(o=>ws(o.w)),ov=Math.round(a.reduce((x,s)=>x+s.p,0)/a.length),T=st.t.map(t=>t.p+t.c+t.b),l3=T.slice(-3),av=l3.length?Math.round(l3.reduce((x,y)=>x+y,0)/l3.length):null;
 return`<h1>Report card</h1><div class=card><h2>Overall: <span class="pill ${gcl(ov)}">${gr(ov)}</span> ${ov}%</h2><p class=mu>Chapters complete ${ch.filter(x=>done(x.id)).length} of ${ch.length}. Tests ${T.length}${T.length?', best '+Math.max(...T)+', last three average '+av:''}. Target 650+.</p><p>${ov>=70?'You are on track. Protect this rhythm.':ov>=40?'Slightly behind. Clear two pending chapters this week before anything else.':'The backlog is growing. Start nothing new outside Yakeen. Clear pending chapters and finish all 11 daily ticks.'}</p></div>${strip()}
<div class=card>${W.map(o=>{const s=ws(o.w),p=o.w<=CW;return`<button class=w data-a="goto:${o.w}"><span>Week ${o.w}, ${fmt(dt(o.w*7-6))}</span><span class=mu>${p?`days ${s.dd}/7, tests ${s.ts.length}/${s.pt}${s.av!==null?', avg '+s.av:''}`:o.ph.split(': ')[1]}</span>${p?`<span class="pill ${gcl(s.p)}">${s.g}</span>`:'<span></span>'}</button>`}).join('')}</div>`},
gd(){const SB=[['P','Physics, 180 marks, 2.5 h a day',[['Focus','Mechanics, Rotational Motion, Thermodynamics, Electrostatics, Current Electricity, Magnetism, Optics and Modern Physics carry the most marks. Concept first, then formula, then numericals.'],['Lecture speed','1.5x. Hard chapters (Rotation, Electrostatics, EMI) at 1x. Familiar parts at 2x.'],['Notes','One page per chapter: formulas, units, graphs, common mistakes. Do not copy the lecture.'],['Revise','15 minutes of formulas daily. Revise each chapter after 1, 7 and 30 days.'],['Practice','30 numericals and 40 PYQs per chapter. Spend at most 3 minutes per question in practice, mark it and move on.']]],
['C','Chemistry, 180 marks, 2 h a day',[['Focus','Physical: numericals. Inorganic: NCERT line by line and exceptions. Organic: reactions and mechanisms.'],['Lecture speed','Physical 1.25x, Organic 1.5x, Inorganic 2x with NCERT Pitara alongside.'],['Notes','Physical: formulas and numerical types. Inorganic: exception table. Organic: one reaction map per chapter and name reactions.'],['Revise','20 minutes of Inorganic and Organic daily, because they fade fastest.'],['Practice','Physical: 40 numericals and 30 PYQs. Inorganic and Organic: 50 PYQs plus NCERT in-text questions.']]],
['B','Biology, 360 marks, 2.5 h a day',[['Focus','NCERT is everything. Human Physiology, Genetics, Molecular Basis, Ecology, Reproduction, Cell Cycle and Plant Physiology give the most questions.'],['Lecture speed','2x. Slow down only where something is unclear. Give the saved time to NCERT.'],['Notes','Very few separate notes. Highlight NCERT, redraw diagrams, keep tables (hormones, disorders, enzymes) and one page of exceptions.'],['Revise','Read NCERT line by line at least three times. Draw diagrams daily. Revise after 1, 7 and 30 days.'],['Practice','60 PYQs per chapter plus statement and assertion-reason questions. Aim for 320+ in Biology.']]]];
 return`<h1>Guide</h1><div class=card><h2>How Yakeen and this plan work together</h2><ul><li>Yakeen 2.0 runs 3 live classes a day, 6 days a week, and its live syllabus ends on 15 Feb 2027. Revision classes and AITS follow.</li><li>Watch each day's three lectures (Physics, Chemistry, Biology) live or as same-day recordings. That is your Yakeen track.</li><li>Backlog runs beside it: one block per subject every day for six weeks, then that block turns into spaced revision.</li><li>Use the Yakeen DPPs (quiz format with video solutions), PYQ sheets, NCERT Pitara and the Prep Meter in the PW app inside these blocks.</li><li>Sunday has no new lecture: weekly test in the morning, analysis in the evening, catch up on anything skipped.</li><li>Update Yakeen sync in the Tracker tab whenever the batch moves on faster or slower than the plan.</li></ul></div>
<div class=card><h2>A day with 9 study hours</h2><div class=dg><table><tr><th></th><th>9 h</th><th>7 h</th></tr><tr><td>Physics</td><td>2.5</td><td>2</td></tr><tr><td>Chemistry</td><td>2</td><td>1.5</td></tr><tr><td>Biology</td><td>2.5</td><td>2</td></tr><tr><td>Mixed PYQs</td><td>1</td><td>0.75</td></tr><tr><td>Revision</td><td>1</td><td>0.75</td></tr></table></div><p class=mu>Short on time? Follow the 7 h column. Never drop a subject, shrink the block instead.</p></div>`+SB.map(([k,t,r])=>`<div class="card sc" style="--c:var(--${k})"><h2>${t}</h2>${r.map(([a,b])=>`<p><b>${a}:</b> ${b}</p>`).join('')}</div>`).join('')+`<div class=card><h2>After every test</h2><p>Spend twice as long on analysis as on the test. Sort each mistake into concept gap, silly error or time pressure, and write it in the Error notebook. Attempt tests in exam conditions: 3 hours 20 minutes with an OMR sheet.</p></div><div class=card><h2>Discipline code</h2><ol>${DR.map(r=>`<li>${r}</li>`).join('')}</ol></div><div class=qt>“${Q[(N+7)%Q.length]}”</div>`}};
function R(){$('#v').innerHTML=V[tab]();$('#nav').innerHTML=[['t','Today'],['wk','Week'],['ch','Tracker'],['ts','Tests'],['rp','Report'],['gd','Guide']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab:${k}">${l}</button>`).join('')}
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.c){const[id,b]=d.c.split(':');st.c[id]=t.checked?gc(id)|+b:gc(id)&~+b}
 else if(d.d){const[n,i]=d.d.split(':').map(Number),m=1<<i,v=st.d[n]||0;st.d[n]=t.checked?v|m:v&~m}
 else if(d.k){const[id,i]=d.k.split(':'),k=st.k[id]||(st.k[id]=[0,0,0,0]);k[+i]=Math.max(0,Math.floor(+t.value||0))}
 else if(d.hp!==undefined)st.hp[+d.hp]=Math.max(0,+t.value||0);
 else if(d.h!==undefined){const a=st.h[N]||(st.h[N]=[0,0,0]);a[+d.h]=Math.max(0,+t.value||0)}
 else if(d.s!==undefined)st.s[N][+d.s].d=t.checked?1:0;
 else if(d.y){st.y[d.y]=+t.value;st.ys=1;build()}else return;
 save();R()});

 else if(a==='slot'){const v=$('#stx').value.trim(),tm=$('#stt').value;if(!v)return;(st.s[N]||(st.s[N]=[])).push({t:tm||'--:--',x:v,d:0});st.s[N].sort((p,q)=>p.t<q.t?-1:1);save();R()}
